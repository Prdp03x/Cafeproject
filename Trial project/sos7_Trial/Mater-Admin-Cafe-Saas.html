<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CafeOS Admin — Master Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --surface-3:#E9EFF6;
  --text:#0F172A; --text-2:#64748B; --text-3:#94A3B8;
  --border:#E2E8F0; --border-2:#CBD5E1;
  --primary:#2563EB; --primary-2:#1D4ED8; --primary-soft:#EFF6FF; --primary-ring:rgba(37,99,235,.18);
  --success:#16A34A; --success-soft:#F0FDF4;
  --warning:#D97706; --warning-soft:#FFFBEB;
  --danger:#DC2626;  --danger-soft:#FEF2F2;
  --info:#0284C7;    --info-soft:#F0F9FF;
  --violet:#7C3AED;  --violet-soft:#F5F3FF;
  --slate:#475569;   --slate-soft:#F1F5F9;
  --sb:#0B1526; --sb-2:#0E1B30; --sb-text:#8FA3BF; --sb-text-dim:#5B6C88;
  --r:12px; --r-sm:8px; --r-lg:16px;
  --sh-sm:0 1px 2px rgba(15,23,42,.05);
  --sh-md:0 4px 14px -4px rgba(15,23,42,.10);
  --sh-lg:0 18px 44px -14px rgba(15,23,42,.22);
  --ui:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
[data-theme="dark"]{
  --bg:#0A1120; --surface:#101A2E; --surface-2:#16223A; --surface-3:#1C2A45;
  --text:#E6EDF7; --text-2:#93A4BC; --text-3:#64748B;
  --border:#1F2D47; --border-2:#2B3B5A;
  --primary-soft:rgba(37,99,235,.14); --success-soft:rgba(22,163,74,.14);
  --warning-soft:rgba(217,119,6,.14); --danger-soft:rgba(220,38,38,.14);
  --info-soft:rgba(2,132,199,.14); --violet-soft:rgba(124,58,237,.16); --slate-soft:#1C2A45;
  --sh-sm:0 1px 2px rgba(0,0,0,.4); --sh-md:0 4px 14px -4px rgba(0,0,0,.5); --sh-lg:0 18px 44px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--ui);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(600px 300px at 12% -5%,rgba(37,99,235,.07),transparent 60%),
             radial-gradient(700px 340px at 95% -10%,rgba(2,132,199,.05),transparent 60%);}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:26px 26px;
  mask-image:linear-gradient(180deg,rgba(0,0,0,.5),transparent 480px);}
[data-theme="dark"] body::after{opacity:.15}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--text)}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px;border:2px solid var(--bg)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}

/* ============================================================
   2. APP SHELL — SIDEBAR / TOPBAR
   ============================================================ */
.app{position:relative;z-index:1;display:flex;min-height:100vh}
.sidebar{width:264px;position:fixed;inset:0 auto 0 0;z-index:70;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--sb-2),var(--sb));color:var(--sb-text);
  transition:width .22s ease,transform .25s ease;overflow:hidden}
.sb-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;flex:0 0 auto}
.sb-logo{width:36px;height:36px;flex:0 0 36px;border-radius:10px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#2563EB,#0EA5E9);box-shadow:0 6px 16px -6px rgba(37,99,235,.7)}
.sb-logo svg{width:19px;height:19px}
.sb-name{font-weight:800;font-size:15.5px;color:#F1F5F9;letter-spacing:-.02em;white-space:nowrap}
.sb-name small{display:block;font-size:9.5px;font-weight:600;letter-spacing:.16em;color:var(--sb-text-dim);text-transform:uppercase}
.sb-env{margin:0 16px 10px;padding:5px 10px;border-radius:8px;background:rgba(37,99,235,.12);border:1px solid rgba(37,99,235,.28);
  font-family:var(--mono);font-size:10.5px;color:#93C5FD;display:flex;align-items:center;gap:7px;white-space:nowrap}
.sb-env .pulse{width:7px;height:7px;border-radius:50%;background:#34D399;flex:0 0 7px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}50%{box-shadow:0 0 0 5px rgba(52,211,153,0)}}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 12px 12px}
.sb-nav::-webkit-scrollbar{width:5px}.sb-nav::-webkit-scrollbar-thumb{background:#233350;border:0}
.sb-group{margin-top:14px}
.sb-glabel{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sb-text-dim);padding:0 10px 6px;white-space:nowrap}
.sb-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:500;color:var(--sb-text);
  margin:1px 0;position:relative;white-space:nowrap;transition:background .15s,color .15s;border:1px solid transparent}
.sb-item svg{width:17px;height:17px;flex:0 0 17px;opacity:.85}
.sb-item:hover{background:rgba(148,163,184,.09);color:#E2E8F0}
.sb-item.active{background:rgba(37,99,235,.16);color:#fff;border-color:rgba(37,99,235,.35)}
.sb-item.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:#3B82F6}
.sb-badge{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;background:rgba(148,163,184,.16);color:#CBD5E1}
.sb-badge.warn{background:rgba(245,158,11,.18);color:#FBBF24}
.sb-badge.danger{background:rgba(220,38,38,.22);color:#FCA5A5}
.sb-foot{flex:0 0 auto;border-top:1px solid rgba(148,163,184,.12);padding:10px 12px}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer;transition:background .15s;white-space:nowrap}
.sb-user:hover{background:rgba(148,163,184,.09)}
.sb-user .av{width:34px;height:34px;flex:0 0 34px}
.sb-uname{font-size:13px;font-weight:600;color:#E2E8F0}
.sb-urole{font-size:11px;color:var(--sb-text-dim)}
.sb-footrow{display:flex;gap:4px;margin-top:6px}
.sb-fbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--sb-text-dim);font-size:11px;font-weight:600;transition:.15s}
.sb-fbtn:hover{background:rgba(148,163,184,.1);color:#E2E8F0}
.sb-fbtn svg{width:15px;height:15px}
.sb-collapse{position:absolute;top:22px;right:-13px;width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--border);
  display:grid;place-items:center;box-shadow:var(--sh-md);z-index:80;color:var(--text-2);transition:.2s}
.sb-collapse:hover{color:var(--primary);border-color:var(--primary)}
.sb-collapse svg{width:14px;height:14px;transition:transform .25s}
body.sb-collapsed .sidebar{width:78px}
body.sb-collapsed .sb-collapse svg{transform:rotate(180deg)}
body.sb-collapsed .sb-name,body.sb-collapsed .sb-glabel,body.sb-collapsed .sb-item span.lbl,body.sb-collapsed .sb-badge,
body.sb-collapsed .sb-user div,body.sb-collapsed .sb-fbtn span,body.sb-collapsed .sb-env span{display:none}
body.sb-collapsed .sb-item{justify-content:center;padding:10px}
body.sb-collapsed .sb-user{justify-content:center}
body.sb-collapsed .sb-env{justify-content:center;padding:5px}
body.sb-collapsed .sb-item:hover::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);
  background:var(--text);color:var(--surface);font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:7px;white-space:nowrap;z-index:99;box-shadow:var(--sh-md)}
.main{flex:1;margin-left:264px;min-width:0;transition:margin .22s ease;display:flex;flex-direction:column;min-height:100vh}
body.sb-collapsed .main{margin-left:78px}
.backdrop{position:fixed;inset:0;background:rgba(8,15,30,.5);backdrop-filter:blur(2px);z-index:65;opacity:0;pointer-events:none;transition:opacity .25s}
body.sb-open .backdrop{opacity:1;pointer-events:auto}

/* Impersonation banner */
.imp-banner{position:sticky;top:0;z-index:90;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  padding:9px 16px;background:repeating-linear-gradient(-45deg,#7C2D12,#7C2D12 14px,#92400E 14px,#92400E 28px);color:#FDE68A;
  font-size:13px;font-weight:600;border-bottom:1px solid #B45309}
.imp-banner .btn{background:#FEF3C7;color:#78350F;border:0}
.imp-banner svg{width:16px;height:16px}

/* Topbar */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:0 24px;height:62px;
  background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.tb-burger{display:none}
.tb-title h1{font-size:16.5px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.crumbs{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3)}
.crumbs a:hover{color:var(--primary)}
.crumbs svg{width:12px;height:12px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.search-btn{display:flex;align-items:center;gap:9px;min-width:250px;padding:8px 12px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-3);font-size:13px;transition:.15s;box-shadow:var(--sh-sm)}
.search-btn:hover{border-color:var(--primary);color:var(--text-2);box-shadow:0 0 0 3px var(--primary-ring)}
.search-btn svg{width:15px;height:15px}
.search-btn kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--text-3)}
.icon-btn{position:relative;width:37px;height:37px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  display:grid;place-items:center;color:var(--text-2);transition:.15s;box-shadow:var(--sh-sm)}
.icon-btn:hover{color:var(--primary);border-color:var(--primary);transform:translateY(-1px);box-shadow:0 0 0 3px var(--primary-ring)}
.icon-btn svg{width:17px;height:17px}
.n-dot{position:absolute;top:6px;right:7px;min-width:15px;height:15px;border-radius:8px;background:var(--danger);color:#fff;
  font-size:9.5px;font-weight:700;font-family:var(--mono);display:grid;place-items:center;padding:0 3px;border:2px solid var(--surface)}

/* Dropdowns */
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 8px);right:0;min-width:230px;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--sh-lg);padding:6px;z-index:95;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:.16s}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu.left{right:auto;left:0}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;border:0;background:none;text-align:left;
  font-size:13px;font-weight:500;color:var(--text);transition:.12s}
.mi:hover{background:var(--surface-2)}
.mi.danger{color:var(--danger)} .mi.danger:hover{background:var(--danger-soft)}
.mi svg{width:15.5px;height:15.5px;color:var(--text-2)} .mi.danger svg{color:var(--danger)}
.mi small{margin-left:auto;color:var(--text-3);font-size:11px}
.menu-hd{padding:8px 10px 6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.menu hr{border:0;border-top:1px solid var(--border);margin:5px 4px}
.notif-panel{width:360px;padding:0;overflow:hidden}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--border)}
.notif-head b{font-size:13.5px}
.notif-list{max-height:380px;overflow:auto}
.notif-item{display:flex;gap:11px;padding:12px 15px;border-bottom:1px solid var(--border);cursor:pointer;transition:.12s}
.notif-item:hover{background:var(--surface-2)}
.notif-item.unread{background:var(--primary-soft)}
.notif-item .n-ic{width:32px;height:32px;flex:0 0 32px;border-radius:9px;display:grid;place-items:center}
.notif-item .n-ic svg{width:16px;height:16px}
.notif-item p{font-size:12.8px;font-weight:500}
.notif-item time{font-size:11px;color:var(--text-3)}
.notif-foot{padding:10px;text-align:center}
.prof-card{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--border);margin-bottom:5px}

/* ============================================================
   3. CONTENT / VIEWS
   ============================================================ */
.view{flex:1;padding:24px;max-width:1440px;width:100%;margin:0 auto}
.view-enter{animation:viewIn .35s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-hd h2{font-size:21px;font-weight:800;letter-spacing:-.025em}
.page-hd .sub{font-size:13px;color:var(--text-2);margin-top:3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gap-lg{gap:16px}
.mt{margin-top:16px}.mt-lg{margin-top:24px}.mb{margin-bottom:16px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-sm);transition:box-shadow .2s,border-color .2s}
.card:hover{box-shadow:var(--sh-md)}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-hd h3{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.card-hd .hint{font-size:12px;color:var(--text-3)}
.card-bd{padding:18px}
.card-bd.tight{padding:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}.g-1-2{grid-template-columns:1fr 2fr}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 16px 13px;
  box-shadow:var(--sh-sm);overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--border-2)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.kpi-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.kpi-ic svg{width:18px;height:18px}
.kpi-val{font-family:var(--mono);font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.kpi-lbl{font-size:12.5px;font-weight:600;color:var(--text-2);margin-top:3px}
.kpi-foot{display:flex;align-items:center;gap:8px;margin-top:9px}
.delta{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px}
.delta svg{width:12px;height:12px}
.delta.up{color:var(--success);background:var(--success-soft)}
.delta.down{color:var(--danger);background:var(--danger-soft)}
.delta.flat{color:var(--text-2);background:var(--surface-2)}
.kpi-vs{font-size:11px;color:var(--text-3)}
.kpi .spark{position:absolute;right:14px;bottom:12px;opacity:.9}

/* Badges & chips */
.bdg{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.bdg::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.bdg.nodot::before{display:none}
.b-g{color:var(--success);background:var(--success-soft)}
.b-r{color:var(--danger);background:var(--danger-soft)}
.b-a{color:var(--warning);background:var(--warning-soft)}
.b-b{color:var(--primary);background:var(--primary-soft)}
.b-v{color:var(--violet);background:var(--violet-soft)}
.b-s{color:var(--slate);background:var(--slate-soft)}
.b-i{color:var(--info);background:var(--info-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.chip svg{width:12px;height:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8.5px 15px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:13px;font-weight:600;transition:.15s;box-shadow:var(--sh-sm);white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh-md);border-color:var(--border-2)}
.btn:active{transform:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px -4px rgba(37,99,235,.5)}
.btn.primary:hover{background:var(--primary-2)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;box-shadow:0 4px 12px -4px rgba(220,38,38,.45)}
.btn.soft{background:var(--surface-2);border-color:transparent;box-shadow:none}
.btn.soft:hover{background:var(--surface-3)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{padding:5.5px 11px;font-size:12px;border-radius:7px}
.btn.sm svg{width:13px;height:13px}
.btn.iconb{padding:7px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none}
.btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.lbl{font-size:12.5px;font-weight:600;color:var(--text-2)}
.lbl .req{color:var(--danger)}
.inp,.sel,.txt{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);transition:.15s;font-size:13.5px}
.inp:focus,.sel:focus,.txt:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.inp.err,.sel.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(220,38,38,.12)}
.txt{min-height:88px;resize:vertical}
.ferr{font-size:11.5px;color:var(--danger);display:none}
.field.invalid .ferr{display:block}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.inp-wrap{position:relative}
.inp-wrap .inp{padding-right:38px}
.inp-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--text-3);padding:6px;border-radius:6px}
.inp-eye:hover{color:var(--text)}
.inp-eye svg{width:16px;height:16px}
.hint{font-size:11.5px;color:var(--text-3)}
/* switch */
.sw{position:relative;display:inline-block;width:38px;height:22px;flex:0 0 38px}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:20px;background:var(--border-2);transition:.2s;cursor:pointer}
.sw i::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:var(--sh-sm)}
.sw input:checked + i{background:var(--primary)}
.sw input:checked + i::after{left:19px}
.sw input:disabled + i{opacity:.5;cursor:not-allowed}

/* ============================================================
   4. TABLES
   ============================================================ */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.toolbar .inp{width:auto;min-width:210px}
.toolbar .sel{width:auto}
.toolbar .spacer{flex:1}
.table-scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:880px}
.tbl th{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--text-3);text-align:left;
  padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface);user-select:none}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--primary)}
.tbl th .arr{font-family:var(--mono);font-size:10px}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;white-space:nowrap}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr.sel{background:var(--primary-soft)}
.tbl tbody tr.click{cursor:pointer}
.tbl tr.hl-warn{background:var(--warning-soft)}
.tbl .cbx{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
.cell-main{font-weight:600}
.cell-sub{font-size:11.5px;color:var(--text-3)}
.tbl-foot{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;font-size:12.5px;color:var(--text-2)}
.bulkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--primary-soft);border-bottom:1px solid var(--border)}
.bulkbar b{font-size:12.5px;color:var(--primary)}
.av{width:32px;height:32px;border-radius:9px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 32px}
.av-lg{width:52px;height:52px;border-radius:14px;font-size:18px}
.cell-id{font-family:var(--mono);font-size:12px;color:var(--text-2)}

/* Progress */
.pbar{height:7px;border-radius:6px;background:var(--surface-2);overflow:hidden;min-width:90px}
.pfill{height:100%;border-radius:6px;background:var(--primary);transition:width 1s cubic-bezier(.2,.7,.2,1)}
.pfill.ok{background:var(--success)} .pfill.warn{background:var(--warning)} .pfill.danger{background:var(--danger)}
.pline{display:flex;align-items:center;gap:12px}
.pline .mono{font-size:12px}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:10px 15px;font-size:13px;font-weight:600;color:var(--text-2);border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}

/* Timeline */
.tl{position:relative;padding-left:8px}
.tl-item{position:relative;display:flex;gap:13px;padding:0 0 20px 34px}
.tl-item::before{content:"";position:absolute;left:13px;top:30px;bottom:-2px;width:2px;background:var(--border)}
.tl-item:last-child::before{display:none}
.tl-ic{position:absolute;left:0;top:2px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;z-index:1}
.tl-ic svg{width:14px;height:14px}
.tl-item p{font-size:13px;font-weight:500}
.tl-item time{font-size:11.5px;color:var(--text-3)}

/* Charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10.5px;fill:var(--text-3)}
.chart .grid-l{stroke:var(--border);stroke-dasharray:3 4}
.chart .ln{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s .1s ease forwards}
.chart .ln-dash{stroke-dasharray:.02 .008;animation:none;opacity:.55}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .area{opacity:0;animation:fadeIn .8s .5s forwards}
@keyframes fadeIn{to{opacity:1}}
.chart .bar{transform:scaleY(0);transform-origin:bottom;transform-box:fill-box;animation:grow .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes grow{to{transform:scaleY(1)}}
.chart .dot{opacity:0;animation:fadeIn .4s forwards}
.donut-seg{transition:stroke-dashoffset 1s ease}
.legend{display:flex;flex-direction:column;gap:9px}
.lg-row{display:flex;align-items:center;gap:9px;font-size:12.5px}
.lg-sw{width:11px;height:11px;border-radius:4px;flex:0 0 11px}
.lg-val{margin-left:auto;font-family:var(--mono);font-weight:600;font-size:12.5px}
.lg-pct{color:var(--text-3);font-family:var(--mono);font-size:11px;width:44px;text-align:right}
.segbar{display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.segbar > div{transition:width 1s ease}

/* Stepper (wizard) */
.steps{display:flex;gap:0;margin-bottom:24px;overflow-x:auto}
.step{flex:1;display:flex;align-items:center;gap:10px;min-width:150px;position:relative;padding-right:14px}
.step::after{content:"";flex:1;height:2px;background:var(--border);border-radius:2px}
.step:last-child::after{display:none}
.step .n{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12.5px;font-weight:700;
  background:var(--surface-2);color:var(--text-3);border:2px solid var(--border);transition:.3s}
.step b{font-size:12.5px;color:var(--text-3);font-weight:600;white-space:nowrap}
.step.on .n{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--primary-ring)}
.step.on b{color:var(--text)}
.step.done .n{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.step.done b{color:var(--text-2)}

/* Plan cards */
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.plan-card{position:relative;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:22px;transition:.2s;box-shadow:var(--sh-sm)}
.plan-card:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.plan-card.sel{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.plan-card.pop::before{content:"MOST POPULAR";position:absolute;top:-10px;left:20px;background:var(--primary);color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.12em;padding:3px 9px;border-radius:6px}
.plan-price{font-family:var(--mono);font-size:29px;font-weight:700;letter-spacing:-.03em;margin:10px 0 2px}
.plan-price small{font-size:13px;color:var(--text-3);font-weight:500}
.plan-feat{list-style:none;margin:15px 0 18px;display:flex;flex-direction:column;gap:8px}
.plan-feat li{display:flex;gap:9px;font-size:13px;color:var(--text-2)}
.plan-feat svg{width:15px;height:15px;color:var(--success);flex:0 0 15px;margin-top:2px}
.plan-stats{display:flex;gap:0;border-top:1px solid var(--border);margin-top:14px;padding-top:12px}
.plan-stats div{flex:1;text-align:center}
.plan-stats div + div{border-left:1px solid var(--border)}
.plan-stats b{display:block;font-family:var(--mono);font-size:14px}
.plan-stats span{font-size:10.5px;color:var(--text-3)}

/* Skeleton */
.sk{position:relative;overflow:hidden;background:var(--surface-2);border-radius:10px}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shimmer 1.4s infinite;transform:translateX(-100%)}
[data-theme="dark"] .sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent)}
@keyframes shimmer{to{transform:translateX(100%)}}
.sk-grid{display:grid;gap:14px}

/* Empty state */
.empty{padding:52px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .e-ic{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-3)}
.empty .e-ic svg{width:26px;height:26px}
.empty h4{font-size:15px;font-weight:700}
.empty p{font-size:13px;color:var(--text-2);max-width:380px}

/* Modal */
.ovl{position:fixed;inset:0;z-index:120;background:rgba(8,15,30,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;animation:fadeIn .18s}
.dlg{width:100%;max-width:480px;background:var(--surface);border-radius:16px;box-shadow:var(--sh-lg);border:1px solid var(--border);
  animation:dlgIn .22s cubic-bezier(.2,.9,.3,1.2);max-height:92vh;display:flex;flex-direction:column}
.dlg.lg{max-width:680px}.dlg.xl{max-width:860px}
@keyframes dlgIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
.dlg-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 0}
.dlg-hd h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
.dlg-hd .sub{font-size:12.5px;color:var(--text-2);margin-top:2px}
.dlg-bd{padding:16px 20px;overflow:auto}
.dlg-ft{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border)}
.dlg-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:12px}
.dlg-ic svg{width:22px;height:22px}

/* Toast */
.toasts{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:11px;min-width:290px;max-width:400px;padding:12px 15px;border-radius:12px;background:var(--surface);
  border:1px solid var(--border);box-shadow:var(--sh-lg);font-size:13px;font-weight:500;animation:toastIn .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}}
.toast.out{animation:toastOut .25s forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
.toast .t-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:0 0 28px}
.toast .t-ic svg{width:15px;height:15px}

/* Command palette */
.ck-ovl{position:fixed;inset:0;z-index:150;background:rgba(8,15,30,.5);backdrop-filter:blur(3px);display:flex;justify-content:center;padding:12vh 16px 16px;animation:fadeIn .15s}
.cmdk{width:100%;max-width:600px;height:fit-content;background:var(--surface);border-radius:16px;border:1px solid var(--border);box-shadow:var(--sh-lg);overflow:hidden;animation:dlgIn .2s}
.ck-in{display:flex;align-items:center;gap:11px;padding:15px 17px;border-bottom:1px solid var(--border)}
.ck-in svg{width:18px;height:18px;color:var(--text-3)}
.ck-in input{flex:1;border:0;background:none;font-size:15px;outline:none;color:var(--text)}
.ck-in kbd{font-family:var(--mono);font-size:10px;color:var(--text-3);border:1px solid var(--border);border-radius:5px;padding:2px 6px}
.ck-list{max-height:420px;overflow:auto;padding:8px}
.ck-group{padding:9px 10px 4px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.ck-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:13px}
.ck-item .ck-ic{width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--text-2);flex:0 0 30px}
.ck-item .ck-ic svg{width:15px;height:15px}
.ck-item small{margin-left:auto;color:var(--text-3);font-family:var(--mono);font-size:11px}
.ck-item.sel{background:var(--primary-soft)}
.ck-item.sel .ck-ic{background:var(--primary);color:#fff}
.ck-item b{font-weight:600}
.ck-item .sub2{display:block;font-size:11px;color:var(--text-3);font-weight:400}

/* Misc */
.info-note{display:flex;gap:12px;padding:13px 16px;border-radius:11px;font-size:12.8px;border:1px solid}
.info-note svg{width:17px;height:17px;flex:0 0 17px;margin-top:1px}
.note-info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent);color:var(--text)}
.note-info svg{color:var(--info)}
.note-warn{background:var(--warning-soft);border-color:color-mix(in srgb,var(--warning) 30%,transparent)}
.note-warn svg{color:var(--warning)}
.note-danger{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.note-danger svg{color:var(--danger)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 20px;font-size:13px}
.kv dt{color:var(--text-2);font-weight:500}
.kv dd{font-weight:600;text-align:right;font-family:var(--mono);font-size:12.5px}
.split{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px}
.split:last-child{border:0}
.divider{border:0;border-top:1px solid var(--border);margin:14px 0}
/* invoice */
.inv-doc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:26px;font-size:13px}
.inv-doc table{width:100%;border-collapse:collapse;margin-top:16px}
.inv-doc th{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);text-align:left;padding:8px;border-bottom:1px solid var(--border)}
.inv-doc td{padding:10px 8px;border-bottom:1px solid var(--border)}
.stamp{display:inline-block;padding:4px 12px;border:2px solid var(--success);color:var(--success);border-radius:8px;font-weight:800;font-size:12px;letter-spacing:.14em;transform:rotate(-4deg)}
/* chat */
.chat{display:flex;flex-direction:column;gap:12px;max-height:340px;overflow:auto;padding:4px}
.msg{max-width:78%;padding:10px 13px;border-radius:12px;font-size:13px}
.msg .who{font-size:11px;font-weight:700;margin-bottom:3px;display:flex;gap:8px;align-items:center}
.msg .who time{color:var(--text-3);font-weight:400;font-family:var(--mono);font-size:10px}
.msg.admin{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.admin .who{color:rgba(255,255,255,.8)}
.msg.user{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
/* matrix */
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}

/* ============================================================
   5. RESPONSIVE
   ============================================================ */
@media(max-width:1120px){.g-2-1,.g-1-2{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:900px){
  .sidebar{transform:translateX(-102%);width:280px}
  body.sb-open .sidebar{transform:none}
  .main,body.sb-collapsed .main{margin-left:0}
  .sb-collapse{display:none}
  .tb-burger{display:grid}
  .search-btn{min-width:0}.search-btn span,.search-btn kbd{display:none}
  .g2,.g3,.g4{grid-template-columns:1fr}
}
@media(max-width:640px){
  .view{padding:14px}
  .topbar{padding:0 14px}
  .tb-title .crumbs{display:none}
  .fgrid{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi-val{font-size:19px}
  .step b{display:none}
  .toolbar .inp{min-width:140px;flex:1}
}
@media(max-width:420px){.kpis{grid-template-columns:1fr}}

<script>
/* ════════════════════════════════════════════════════════════
   CafeOS Master Admin — modular vanilla JS
   Sections: utils · mock-data · charts · ui-primitives · table ·
             layout · views · router · palette/notifications · init
   (Splits 1:1 into the requested js/ files: app, navigation,
    modal, notifications, charts, tables, mock-data.)
   ════════════════════════════════════════════════════════════ */

/* ---------- 1. UTILS ---------- */
const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const INRF=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
const inr=n=>'₹'+INRF.format(Math.round(n));
const inrL=n=>'₹'+(n/1e5).toFixed(n>=1e6?1:2)+'L';
const inrCr=n=>'₹'+(n/1e7).toFixed(2)+' Cr';
const compact=n=>n>=1e7?inrCr(n):n>=1e5?inrL(n):inr(n);
const fmtDate=d=>new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const fmtDT=d=>new Date(d).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d};
const daysAhead=n=>{const d=new Date();d.setDate(d.getDate()+n);return d};
function timeAgo(d){const s=(Date.now()-new Date(d))/1e3;if(s<90)return'just now';if(s<3600)return Math.round(s/60)+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';if(s<86400*30)return Math.round(s/86400)+'d ago';return fmtDate(d)}
const rnd=i=>{const x=Math.sin(i*9301+49297)*233280;return x-Math.floor(x)};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const debounce=(f,t)=>{let x;return(...a)=>{clearTimeout(x);x=setTimeout(()=>f(...a),t)}};
const icons=()=>window.lucide&&lucide.createIcons();
function countUp(el){$$('[data-count]',el||document).forEach(e=>{if(e._done)return;e._done=1;const t=parseFloat(e.dataset.count),f=e.dataset.f||'n',d=900,s=performance.now();
  const fmt=v=>f==='inr'?inr(v):f==='cr'?inrCr(v):f==='l'?inrL(v):INRF.format(Math.round(v));
  (function step(n){const p=Math.min(1,(n-s)/d),ez=1-Math.pow(1-p,3);e.textContent=fmt(t*ez);if(p<1)requestAnimationFrame(step)})(s)})}
function exportCSV(name,rows){const csv=rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();toast('Exported '+name,'ok')}

/* ---------- 2. MOCK DATA ---------- */
const PLANS={
 starter:{id:'starter',name:'Starter',pm:499,py:4990,trial:14,outlets:1,staff:3,orders:5000,storage:'2 GB',products:150,api:'10k/day',subs:512,rev:512*499,conv:'3.1%',pop:false,
   feats:['1 outlet','3 staff accounts','5,000 orders / month','150 products','Basic dashboard','Email support']},
 growth:{id:'growth',name:'Growth',pm:999,py:9990,trial:14,outlets:3,staff:20,orders:20000,storage:'10 GB',products:500,api:'50k/day',subs:405,rev:405*999,conv:'4.6%',pop:true,
   feats:['3 outlets','20 staff accounts','20,000 orders / month','500 products','Advanced reports','Priority email support']},
 pro:{id:'pro',name:'Pro',pm:1999,py:19990,trial:14,outlets:-1,staff:100,orders:-1,storage:'50 GB',products:-1,api:'200k/day',subs:91,rev:91*1999,conv:'2.2%',pop:false,
   feats:['Unlimited outlets','100 staff accounts','Unlimited orders','Unlimited products','Advanced analytics','API access','Priority support']},
 enterprise:{id:'enterprise',name:'Enterprise',pm:7999,py:79990,trial:30,outlets:-1,staff:-1,orders:-1,storage:'500 GB',products:-1,api:'Unlimited',subs:12,rev:12*7999,conv:'—',pop:false,
   feats:['Everything in Pro','Dedicated success manager','Custom SLAs','SSO & audit exports','White-label branding']}};
const PLAN_ORDER=['starter','growth','pro','enterprise'];
const PLAN_CLR={starter:'#64748B',growth:'#2563EB',pro:'#7C3AED',enterprise:'#0F172A'};
const STATUS={active:['Active','b-g'],trial:['Trial','b-b'],payment_failed:['Payment Failed','b-r'],suspended:['Suspended','b-s'],
  expired:['Expired','b-a'],pending_setup:['Pending Setup','b-v'],paid:['Paid','b-g'],failed:['Failed','b-r'],refunded:['Refunded','b-v'],
  pending:['Pending','b-a'],settled:['Settled','b-g'],processing:['Processing','b-a'],captured:['Captured','b-g'],
  open:['Open','b-r'],in_progress:['In Progress','b-b'],waiting:['Waiting','b-a'],resolved:['Resolved','b-g'],
  sent:['Sent','b-g'],scheduled:['Scheduled','b-b'],draft:['Draft','b-s'],low:['Low','b-s'],medium:['Medium','b-b'],high:['High','b-a'],urgent:['Urgent','b-r'],
  enabled:['Enabled','b-g'],disabled:['Disabled','b-s'],monthly:['Monthly','b-s'],yearly:['Yearly','b-v'],preparing:['Preparing','b-a'],completed:['Completed','b-g'],cancelled:['Cancelled','b-s']};
const badge=(s,extra='')=>{const m=STATUS[s]||[s,'b-s'];return `<span class="bdg ${m[1]} ${extra}">${m[0]}</span>`};

/* ---------- 3. CHARTS (hand-rolled SVG) ---------- */
const CH_W=640;
function lineSVG({labels,series,h=230,yFmt=v=>v,xEvery=null}){
  const L=52,R=14,T=16,B=28,W=CH_W,H=h;
  const all=series.flatMap(s=>s.data);const max=Math.max(...all)*1.12;
  const n=Math.max(...series.map(s=>s.data.length));
  const X=i=>L+i*(W-L-R)/Math.max(1,n-1), Y=v=>T+(1-v/max)*(H-T-B);
  let g='',grid='';
  for(let k=0;k<=4;k++){const y=T+k*(H-T-B)/4,v=max*(1-k/4);grid+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${yFmt(v)}</text>`}
  let paths='';
  series.forEach((s,si)=>{
    const pts=s.data.map((v,i)=>[X(i),Y(v)]);
    const d='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
    if(s.fill&&si===series.length-1)paths+=`<path class="area" d="${d} L${X(s.data.length-1)},${H-B} L${L},${H-B} Z" fill="url(#grad-${s.fill})" stroke="none"/>`;
    paths+=`<path class="ln ${s.dash?'ln-dash':''}" pathLength="1" d="${d}" stroke="${s.color}" ${s.dash?'stroke-width="2"':''}/>`;
    if(s.dots!==false)paths+=`<circle class="dot" style="animation-delay:${.9+si*.1}s" cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="4" fill="${s.color}"><title>${s.name}: ${yFmt(s.data[s.data.length-1])}</title></circle>`;
  });
  let xl='';const step=xEvery||Math.ceil(n/8);
  labels.forEach((lb,i)=>{if(i%step===0)xl+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${lb}</text>`});
  const grads=series.filter(s=>s.fill).map(s=>`<linearGradient id="grad-${s.fill}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${s.color}" stop-opacity=".22"/><stop offset="100%" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><defs>${grads}</defs>${grid}${xl}${paths}</svg>`}
function barSVG({labels,data,color='#2563EB',h=230,yFmt=v=>v}){
  const L=46,R=10,T=14,B=28,W=CH_W,H=h,max=Math.max(...data)*1.15;
  const Y=v=>T+(1-v/max)*(H-T-B), bw=(W-L-R)/data.length*.56, step=(W-L-R)/data.length;
  let grid='';for(let k=0;k<=4;k++){const y=T+k*(H-T-B)/4;grid+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-7}" y="${y+4}" text-anchor="end">${yFmt(max*(1-k/4))}</text>`}
  const bars=data.map((v,i)=>`<rect class="bar" style="animation-delay:${i*45}ms" x="${L+i*step+(step-bw)/2}" y="${Y(v)}" width="${bw}" height="${H-B-Y(v)}" rx="5" fill="${color}" opacity="${.75+rnd(i)*.25}"><title>${labels[i]}: ${yFmt(v)}</title></rect>`).join('');
  const xl=labels.map((lb,i)=>i%Math.ceil(labels.length/8)===0?`<text x="${L+i*step+step/2}" y="${H-8}" text-anchor="middle">${lb}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${bars}${xl}</svg>`}
function donutSVG({items,size=180,thickness=22,centerTop,centerSub}){
  const total=items.reduce((a,b)=>a+b.value,0),r=(size-thickness)/2,C=2*Math.PI*r;let off=0,segs='';
  items.forEach(it=>{const frac=it.value/total;
    segs+=`<circle class="donut-seg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${it.color}" stroke-width="${thickness}"
      stroke-dasharray="${(frac*C-2).toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-off*C).toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"><title>${it.label}: ${INRF.format(it.value)}</title></circle>`;off+=frac});
  return `<svg class="chart" viewBox="0 0 ${size} ${size}" style="max-width:${size}px;margin:auto">${segs}
    <text x="50%" y="47%" text-anchor="middle" style="font-size:19px;font-weight:700;fill:var(--text);font-family:var(--mono)">${centerTop}</text>
    <text x="50%" y="60%" text-anchor="middle">${centerSub}</text></svg>`}
const sparkSVG=(data,color,w=96,h=30)=>{const max=Math.max(...data),min=Math.min(...data);
  const pts=data.map((v,i)=>[(i/(data.length-1))*w,h-2-((v-min)/(max-min||1))*(h-5)]);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polygon points="${pts.map(p=>p.join(',')).join(' ')} ${w},${h} 0,${h}" fill="${color}" opacity=".12"/><polyline points="${pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/></svg>`};
function segBar(parts){return `<div class="segbar">${parts.map(p=>`<div style="width:${p.pct}%;background:${p.color}" title="${p.label}: ${INRF.format(p.value)}"></div>`).join('')}</div>`}
function legend(items,total){return `<div class="legend">${items.map(it=>`<div class="lg-row"><span class="lg-sw" style="background:${it.color}"></span>${it.label}
  <span class="lg-val">${INRF.format(it.value)}</span><span class="lg-pct">${(it.value/total*100).toFixed(1)}%</span></div>`).join('')}</div>`}

function toast(msg,type='info'){const map={ok:['check-circle-2','var(--success)','var(--success-soft)'],err:['alert-circle','var(--danger)','var(--danger-soft)'],
  warn:['alert-triangle','var(--warning)','var(--warning-soft)'],info:['info','var(--info)','var(--info-soft)']};const m=map[type]||map.info;
  const el=document.createElement('div');el.className='toast';
  el.innerHTML=`<span class="t-ic" style="color:${m[1]};background:${m[2]}"><i data-lucide="${m[0]}"></i></span><span>${msg}</span>`;
  $('#toasts').appendChild(el);icons();setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),260)},3600)}
function openModal({title,sub,body,foot,size=''} , onClose){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="ovl" data-action="ovl"><div class="dlg ${size}" role="dialog" aria-modal="true" aria-label="${esc(title||'')}">
    <div class="dlg-hd"><div><h3>${title||''}</h3>${sub?`<div class="sub">${sub}</div>`:''}</div>
    <button class="btn iconb ghost" data-action="modal-close" aria-label="Close dialog"><i data-lucide="x"></i></button></div>
    <div class="dlg-bd">${body}</div>${foot?`<div class="dlg-ft">${foot}</div>`:''}</div></div>`;
  icons();root._onClose=onClose;setTimeout(()=>{const f=$('.dlg input,.dlg textarea,.dlg select,.dlg .btn.primary',root);f&&f.focus()},60);return root}
function closeModal(){const r=$('#modalRoot');r.innerHTML='';r._onClose=null}

/* ---------- 5. DATA TABLE ENGINE ---------- */
function dataTable(mount,cfg){
  const st={rows:cfg.rows.slice(),page:1,per:cfg.per||10,sk:null,dir:1,sel:new Set()};
  const idKey=cfg.id||'id';
  function sorted(){if(!st.sk)return st.rows;const c=cfg.cols.find(x=>x.key===st.sk);
    return st.rows.slice().sort((a,b)=>{const va=c.val?c.val(a):a[st.sk],vb=c.val?c.val(b):b[st.sk];
    return(typeof va==='number'&&typeof vb==='number'?va-vb:String(va).localeCompare(String(vb)))*st.dir})}
  function draw(){
    const rows=sorted(),total=rows.length,pages=Math.max(1,Math.ceil(total/st.per));
    st.page=Math.min(st.page,pages);
    const pg=rows.slice((st.page-1)*st.per,st.page*st.per);
    let html='';
    if(st.sel.size)html+=`<div class="bulkbar"><b>${st.sel.size} selected</b>${cfg.bulk.map(b=>`<button class="btn sm soft" data-bulk="${b.k}"><i data-lucide="${b.icon}"></i>${b.label}</button>`).join('')}
      <button class="btn sm ghost" data-bulk="clear">Clear</button></div>`;
    html+=`<div class="table-scroll"><table class="tbl"><thead><tr>
      ${cfg.select?`<th style="width:36px"><input type="checkbox" class="cbx" data-thcb ${st.sel.size&&pg.every(r=>st.sel.has(r[idKey]))?'checked':''}></th>`:''}
      ${cfg.cols.map(c=>`<th class="${c.sort?'sortable':''}" data-sort="${c.sort?c.key:''}">${c.label}${st.sk===c.key?` <span class="arr">${st.dir>0?'↑':'↓'}</span>`:''}</th>`).join('')}
    </tr></thead><tbody>`;
    if(!pg.length)html+=`<tr><td colspan="${cfg.cols.length+(cfg.select?1:0)}">${emptyState(cfg.emptyIcon||'search','Nothing here',cfg.emptyMsg||'No records match your current filters.')}</td></tr>`;
    pg.forEach(r=>{html+=`<tr data-rid="${r[idKey]}" class="${cfg.click?'click':''} ${st.sel.has(r[idKey])?'sel':''} ${cfg.rowCls?cfg.rowCls(r):''}">
      ${cfg.select?`<td><input type="checkbox" class="cbx" data-rowcb ${st.sel.has(r[idKey])?'checked':''}></td>`:''}
      ${cfg.cols.map(c=>`<td>${c.render(r)}</td>`).join('')}</tr>`});
    html+=`</tbody></table></div>
    <div class="tbl-foot"><span>Showing ${total?((st.page-1)*st.per+1):'0'}–${Math.min(total,st.page*st.per)} of ${total}</span>
    <div class="row"><label class="muted" style="font-size:12px">Rows
      <select class="sel" data-per style="width:auto;padding:5px 8px">${[10,25,50].map(n=>`<option ${n===st.per?'selected':''}>${n}</option>`).join('')}</select></label>
    <button class="btn sm" data-pg="prev" ${st.page<=1?'disabled':''}><i data-lucide="chevron-left"></i></button>
    <span class="mono muted" style="font-size:12px">${st.page} / ${pages}</span>
    <button class="btn sm" data-pg="next" ${st.page>=pages?'disabled':''}><i data-lucide="chevron-right"></i></button></div></div>`;
    mount.innerHTML=html;icons();
    $$('[data-w]',mount).forEach(p=>requestAnimationFrame(()=>p.style.width=p.dataset.w+'%'));
    $$('th.sortable',mount).forEach(th=>th.onclick=()=>{const k=th.dataset.sort;if(st.sk===k)st.dir*=-1;else{st.sk=k;st.dir=1}draw()});
    const thcb=$('[data-thcb]',mount);if(thcb)thcb.onchange=e=>{pg.forEach(r=>e.target.checked?st.sel.add(r[idKey]):st.sel.delete(r[idKey]));draw()};
    $$('[data-rowcb]',mount).forEach(cb=>cb.onchange=e=>{const rid=e.target.closest('tr').dataset.rid;e.target.checked?st.sel.add(rid):st.sel.delete(rid);draw()});
    $$('[data-pg]',mount).forEach(b=>b.onclick=()=>{st.page+=b.dataset.pg==='next'?1:-1;draw()});
    const per=$('[data-per]',mount);if(per)per.onchange=e=>{st.per=+e.target.value;st.page=1;draw()};
    $$('[data-bulk]',mount).forEach(b=>b.onclick=()=>{if(b.dataset.bulk==='clear'){st.sel.clear();return draw()}
      const bc=cfg.bulk.find(x=>x.k===b.dataset.bulk);bc&&bc.onClick([...st.sel],api)});
    if(cfg.onRow)$$('tr[data-rid]',mount).forEach(tr=>tr.onclick=e=>{if(e.target.closest('input,button,a,.dd'))return;cfg.onRow(sorted().find(r=>String(r[idKey])===tr.dataset.rid))});
  }
  const api={setRows(r){st.rows=r;st.page=1;st.sel.clear();draw()},selected:()=>st.sel,refresh:draw,count:()=>st.rows.length,
    export(name,map){exportCSV(name,[cfg.cols.map(c=>c.label),...sorted().map(map)])}};
  draw();return api}

let routeToken=0;
function route(){
  const token=++routeToken;
  const raw=(location.hash.replace(/^#\/?/,'')||'dashboard').split('?')[0];
  const parts=raw.split('/');let name=parts[0],p1=parts[1],title,crumb,html;
  if(name==='cafe'&&p1&&cafe(p1)){const c=cafe(p1);title=c.name;crumb=['Tenants','All Cafes',c.name];html=vCafeDetail(p1);setActive('cafes')}
  else if(name==='plans'&&p1==='edit'){title='Edit Plan';crumb=['Subscriptions','Plans','Edit'];html=vPlanForm(parts[2]);setActive('plans')}
  else if(name==='plans'&&p1==='new'){title='Create Plan';crumb=['Subscriptions','Plans','New'];html=vPlanForm(null);setActive('plans')}
  else{const m=R[name]||R.dashboard;title=m.t;crumb=m.c;html=m.v();setActive(m.g)}
  $('#pageTitle').textContent=title;document.title=title+' · CafeOS Admin';
  $('#crumbs').innerHTML=`<a href="#/dashboard">Home</a>`+crumb.map((c,i)=>`<i data-lucide="chevron-right"></i><span>${i===crumb.length-1?'<b style="color:var(--text-2)">'+esc(c)+'</b>':esc(c)}</span>`).join('');
  const view=$('#view');view.innerHTML=skeleton();icons();
  setTimeout(()=>{if(token!==routeToken)return;view.innerHTML=`<div class="view-enter">${html}</div>`;icons();countUp();
    if(name==='cafes')window._cafeApply&&bindCafes();
    if(name==='dashboard')startLive();
    view.focus({preventScroll:true});window.scrollTo({top:0})},280)}
function bindCafes(){
  window._cafeDt=dataTable($('#cafeTable'),{rows:CAFES,id:'id',per:10,select:true,click:true,bulk:cafeBulk,
   onRow:c=>location.hash='#/cafe/'+c.id,cols:cafeCols(true),emptyIcon:'store',emptyMsg:'No cafes match these filters.'});
  const apply=()=>{const q=$('#cafeQ').value.toLowerCase(),st=$('#fStatus').value,pl=$('#fPlan').value,ss=$('#fSub').value,rev=$('#fRev').value,age=$('#fAge').value;
    window._cafeDt.setRows(CAFES.filter(c=>(!q||c.name.toLowerCase().includes(q)||c.owner.toLowerCase().includes(q)||c.email.includes(q)||c.phone.includes(q))
      &&(st==='all'||c.status===st)&&(pl==='all'||c.plan===pl)
      &&(ss==='all'||(ss==='subscribed'?!['trial','pending_setup','expired'].includes(c.status):ss==='trial'?c.status==='trial':c.status===ss))
      &&(rev==='all'||(rev==='lt5'?c.gmv<5e5:rev==='5to20'?(c.gmv>=5e5&&c.gmv<2e6):c.gmv>=2e6))
      &&(age==='all'||+c.created>+daysAgo(+age))))};
  $('#cafeQ').oninput=debounce(apply,200);['#fStatus','#fPlan','#fSub','#fRev','#fAge'].forEach(s=>$(s).onchange=apply)}

function ckPool(q){q=q.toLowerCase();const P=[];
  CAFES.filter(c=>!q||c.name.toLowerCase().includes(q)||c.owner.toLowerCase().includes(q)||c.email.includes(q)).slice(0,5)
   .forEach(c=>P.push({g:'Cafes',ic:'store',t:c.name,s:c.owner+' · '+PLANS[c.plan].name,m:()=>location.hash='#/cafe/'+c.id}));
  CAFES.filter(c=>!q||c.subId.toLowerCase().includes(q)).slice(0,3)
   .forEach(c=>P.push({g:'Subscriptions',ic:'credit-card',t:c.subId,s:c.name+' · '+c.cycle,m:()=>location.hash='#/cafe/'+c.id}));
  ORDERS.filter(o=>!q||o.id.toLowerCase().includes(q)).slice(0,3)
   .forEach(o=>P.push({g:'Orders',ic:'shopping-bag',t:o.id,s:o.cafe.name+' · '+inr(o.amount),m:()=>location.hash='#/orders'}));
  INVOICES.filter(i=>!q||i.id.toLowerCase().includes(q)).slice(0,3)
   .forEach(i=>P.push({g:'Invoices',ic:'receipt',t:i.id,s:i.cafe.name+' · '+inr(i.amount),m:()=>location.hash='#/invoices'}));
  TXNS.filter(t=>!q||t.payId.toLowerCase().includes(q)||t.id.toLowerCase().includes(q)).slice(0,3)
   .forEach(t=>P.push({g:'Transactions',ic:'arrow-left-right',t:t.id,s:t.payId+' · '+t.st,m:()=>location.hash='#/transactions'}));
  Object.entries(R).filter(([k,m])=>!q||m.t.toLowerCase().includes(q)).slice(0,q?4:0)
   .forEach(([k,m])=>P.push({g:'Pages',ic:'layout-grid',t:m.t,s:m.c[0],m:()=>location.hash='#/'+k}));
  return P.slice(0,14)}
function drawCk(q){ckItems=ckPool(q);
  $('#ckList').innerHTML=ckItems.length?ckItems.map((it,i)=>`<div class="ck-item ${i===ckIdx?'sel':''}" data-cki="${i}">
   <span class="ck-ic"><i data-lucide="${it.ic}"></i></span><div><b>${esc(it.t)}</b><span class="sub2">${esc(it.s)}</span></div><small>${it.g}</small></div>`).join('')
   +(q?'':'<div class="ck-group" style="border-top:1px solid var(--border);margin-top:6px">Tip: use ↑ ↓ and Enter to navigate</div>')
  :emptyState('search','No results for “'+esc(q)+'”','Try a cafe name, owner email, order ID, subscription ID or page.');
  icons();$$('[data-cki]').forEach(el=>el.onclick=()=>{ckItems[+el.dataset.cki].m();closeCk()})}
function closeCk(){$('#ckRoot').innerHTML=''}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#ckRoot').innerHTML?closeCk():openCmdk();return}
  if(e.key==='Escape'){closeCk();closeModal();$$('.menu.open').forEach(m=>m.classList.remove('open'))}
  if($('#ckRoot').innerHTML&&$('#ckIn')&&document.activeElement===$('#ckIn')){
    if(e.key==='ArrowDown'){e.preventDefault();ckIdx=Math.min(ckItems.length-1,ckIdx+1);drawCk($('#ckIn').value)}
    if(e.key==='ArrowUp'){e.preventDefault();ckIdx=Math.max(0,ckIdx-1);drawCk($('#ckIn').value)}
    if(e.key==='Enter'&&ckItems[ckIdx]){ckItems[ckIdx].m();closeCk()}}});

function toggleMenu(btn,sel){const m=sel?$('#'+sel):btn.closest('.dd').querySelector('.menu');const was=m.classList.contains('open');
  $$('.menu.open').forEach(x=>x!==m&&x.classList.remove('open'));m.classList.toggle('open',!was);icons()}
document.addEventListener('click',e=>{
  if(!e.target.closest('.dd'))$$('.menu.open').forEach(m=>m.classList.remove('open'));
  const t=e.target.closest('[data-action]');if(!t)return;
  const fn=ACTIONS[t.dataset.action];if(fn){e.preventDefault();fn(t,e)}});

/* Wizard step helpers */
function refreshWizard(){const scroll=window.scrollY;const main=$('#view .view-enter')||$('#view');const keep=main.innerHTML;
  $('#view').innerHTML=`<div class="view-enter">${wizardHTML()}</div>`;icons();window.scrollTo(0,scroll)}
function wizardNext(dir){const W=window.W,d=W.d;
  const grab={1:()=>{d.name=$('#wName').value.trim();d.slug=$('#wSlug').value.trim()||d.name.toLowerCase().replace(/[^a-z0-9]+/g,'-');d.addr=$('#wAddr').value;d.city=$('#wCity').value.trim();d.state=$('#wState').value;d.phone=$('#wPhone').value;d.email=$('#wEmail').value.trim();
    let ok=true;const need=(cond,sel)=>{const el=$(sel);el.classList.toggle('err',!cond);el.closest('.field').classList.toggle('invalid',!cond);if(!cond)ok=false};
    need(d.name,'#wName');need(d.city,'#wCity');need(/^\S+@\S+\.\S+$/.test(d.email),'#wEmail');need(d.phone.length>=10,'#wPhone');return ok},
   2:()=>{d.owner=$('#wOwner').value.trim();d.ownerEmail=$('#wOwnerEmail').value.trim();d.ownerPhone=$('#wOwnerPhone').value;
    let ok=true;const need=(cond,sel)=>{const el=$(sel);el.classList.toggle('err',!cond);el.closest('.field').classList.toggle('invalid',!cond);if(!cond)ok=false};
    need(d.owner,'#wOwner');need(/^\S+@\S+\.\S+$/.test(d.ownerEmail),'#wOwnerEmail');return ok},
   3:()=>true,4:()=>{if(!d.verified){toast('Verify Razorpay credentials to continue','warn');return false}return true},5:()=>true}[W.step];
  if(dir>0&&!grab())return;
  W.step=Math.min(5,Math.max(1,W.step+dir));refreshWizard()}

/* ---------- 12. INIT ---------- */
(function init(){
  const th=localStorage.getItem('th');if(th)document.documentElement.dataset.theme=th;
  if(localStorage.getItem('sb')==='1')document.body.classList.add('sb-collapsed');
  renderSidebar();renderTopbar();icons();route();
  window.addEventListener('hashchange',route);
  if(!location.hash)location.hash='#/dashboard';
  /* autoslug preview in wizard */
  document.addEventListener('input',e=>{if(e.target.id==='wName'){const s=$('#wSlug');
    if(s&&!s.value)s.placeholder=e.target.value.toLowerCase().replace(/[^a-z0-9]+/g,'-')||'auto-generated';
    const p=$('#slugPrev');if(p)p.textContent=e.target.value.toLowerCase().replace(/[^a-z0-9]+/g,'-')||'…'}
   if(e.target.closest('.field'))e.target.closest('.field').classList.remove('invalid');
   e.target.classList.remove('err')});
})();
</script>
